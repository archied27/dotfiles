general {
    lock_cmd = pidof hyprlock || hyprlock       # don't start a second hyprlock if one's already running
    before_sleep_cmd = loginctl lock-session    # lock before the system actually suspends
    after_sleep_cmd = hyprctl dispatch dpms on   # make sure the screen wakes up after resume
}

listener {
    timeout = 300                                # 5 minutes idle
    on-timeout = hyprlock                         # lock the screen
}

listener {
    timeout = 330                                # 5.5 minutes idle (30s after the lock fires)
    on-timeout = hyprctl dispatch dpms off        # turn all monitors off
    on-resume = hyprctl dispatch dpms on          # turn them back on on any input
}
