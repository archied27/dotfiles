general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/archie/Pictures/wallpapers/mac/bg2.jpg
    blur_passes = 3
    blur_size = 2
    noise = 0.02
    contrast = 0.9
    brightness = 0.75
}

# Big translucent clock, macOS style
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.55)
    font_size = 100
    font_family = Inter Semi-Bold
    position = 0, 60
    halign = center
    valign = center
}

# Minimal pill password field, no border, translucent
input-field {
    monitor =
    size = 220, 50
    rounding = 15
    outline_thickness = 0
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.18)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 0
}
