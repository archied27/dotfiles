# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

debug {
	disable_logs = false
	enable_stdout_logs = true
}

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor = eDP-1, 1920x1080, 0x0, 1
monitor = HDMI-A-1, 3840x2160, 0x-1080, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = rofi
$browser = firefox


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

#exec-once = dbus-update-activation-environment --systemd -all
#exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
#exec-once = /usr/lib/xdg-desktop-portal-hyprland
#exec-once = /usr/lib/xdg-desktop-portal

#exec-once = $terminal
# exec-once = nm-applet &
#exec-once = export PATH="$HOME/.cargo/bin:$PATH"; waybar
#exec-once = quickshell -p ~/.config/quickshell/qs-hyprview
#exec-once = hyprpaper
#exec-once = Documents/remote-project/remotestart.sh
#exec-once = wl-gammarelay
#exec-once = hyprpm reload
#exec-once = hyprshell daemon
#exec-once = udiskie

#exec-once = ~/.local/bin/random-wallpaper

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = XDG_CURRENT_DESKTOP,Hyprland

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons
# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 12

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(88c0d0ff)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle

    snap {
	enabled = true
	window_gap = 10
	monitor_gap = 10
	respect_gaps = true	
}
}

gesture = 3, horizontal, workspace, 3
gesture = 3, up, dispatcher, exec, quickshell ipc -p ~/.config/quickshell/qs-hyprview call expose open smartgrid
gesture = 3, down, dispatcher, exec, quickshell ipc -p ~/.config/quickshell/qs-hyprview call expose close

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 8
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 3
	noise = 0.02
        vibrancy = 0.1696
    }
}

layerrule = blur on, dim_around on, match:namespace rofi
layerrule = dim_around on, match:namespace quickshell:expose

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.0,  easeOutQuint, slide
    animation = workspacesIn,  1,     1.0,  easeOutQuint, slide
    animation = workspacesOut, 1,     1.0,  easeOutQuint, slide
    animation = zoomFactor,    1,     7,     quick
    animation = layersIn, 1, 1.25, default, popin
}

# --- Special workspace window rules ---
windowrule {
    name = special-float-A
    float = 1
    center = 1
    size = 70% 70%
    match:workspace = special:A
}

windowrule {
    name = special-float-S
    float = 1
    center = 1
    size = 70% 70%
    match:workspace = special:S
}

windowrule {
    name = special-float-D
    float = 1
    center = 1
    size = 70% 70%
    match:workspace = special:D
}

# --- Special workspace settings ---
workspace = special:A, gapsout:20 20 20 20, on-created-empty:true
workspace = special:S, gapsout:20 20 20 20, on-created-empty:true
workspace = special:D, gapsout:20 20 20 20, on-created-empty:true

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
	scroll_factor = 0.3
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod_CTRL, P, exec, grim -g "$(slurp)"
bind = $mainMod_SHIFT, P, exec, grim -g "$(slurp)" - | wl-copy

bind = $mainMod CTRL ALT, up, exec, hyprctl keyword monitor "HDMI-A-1,1920x1080,0x-1080,1"
bind = $mainMod CTRL ALT, left, exec, hyprctl keyword monitor "HDMI-A-1,1920x1080,-1920x0,1"
bind = $mainMod CTRL ALT, right, exec, hyprctl keyword monitor "HDMI-A-1,1920x1080,1920x0,1"

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod_CTRL, RETURN, exec, ~/.local/bin/random-wallpaper
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, ~/.config/hypr/scripts/toggle-clean.sh
bind = $mainMod, SPACE, exec, ~/.config/rofi/launchers/type-1/launcher.sh
bind = $mainMod, O, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, swapnext, # dwindle
bind = $mainMod, F, exec, $browser
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/toggle-float.sh
bind = $mainMod, P, exec, spotify-launcher
bind = $mainMod, L, exec, firefox -P borderless --new-window https://claude.ai/new
bind = $mainMod_SHIFT, Up, exec, busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n +500
bind = $mainMod_SHIFT, Down, exec, busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateTemperature n -500
bind = $mainMod_SHIFT, Left, exec, busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateBrightness d -0.2
bind = $mainMod_SHIFT, Right, exec, busctl --user -- call rs.wl-gammarelay / rs.wl.gammarelay UpdateBrightness d +0.2
bind = $mainMod_CTRL, Up, exec, busctl --user -- set-property rs.wl-gammarelay / rs.wl.gammarelay Temperature q 6500
bind = $mainMod_CTRL, Down, exec, busctl --user -- set-property rs.wl-gammarelay / rs.wl.gammarelay Temperature q 4000
bind = $mainMod_CTRL, Left, exec, busctl --user -- set-property rs.wl-gammarelay / rs.wl.gammarelay Brightness d 0.5
bind = $mainMod_CTRL, Right, exec, busctl --user -- set-property rs.wl-gammarelay / rs.wl.gammarelay Brightness d 1
bind = $mainMod_CTRL, B, exec, ~/.local/bin/bt-toggle.sh


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod_CTRL, 1, workspace, 11
bind = $mainMod_CTRL, 2, workspace, 12
bind = $mainMod_CTRL, 3, workspace, 13
bind = $mainMod_CTRL, 4, workspace, 14
bind = $mainMod_CTRL, 5, workspace, 15
bind = $mainMod_CTRL, 6, workspace, 16
bind = $mainMod_CTRL, 7, workspace, 17
bind = $mainMod_CTRL, 8, workspace, 18
bind = $mainMod_CTRL, 9, workspace, 19
bind = $mainMod_CTRL, 0, workspace, 20


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT CTRL, 1, movetoworkspace, 11
bind = $mainMod SHIFT CTRL, 2, movetoworkspace, 12
bind = $mainMod SHIFT CTRL, 3, movetoworkspace, 13
bind = $mainMod SHIFT CTRL, 4, movetoworkspace, 14
bind = $mainMod SHIFT CTRL, 5, movetoworkspace, 15
bind = $mainMod SHIFT CTRL, 6, movetoworkspace, 16
bind = $mainMod SHIFT CTRL, 7, movetoworkspace, 17
bind = $mainMod SHIFT CTRL, 8, movetoworkspace, 18
bind = $mainMod SHIFT CTRL, 9, movetoworkspace, 19
bind = $mainMod SHIFT CTRL, 0, movetoworkspace, 20

bind = $mainMod ALT, LEFT, movecurrentworkspacetomonitor, l
bind = $mainMod ALT, RIGHT, movecurrentworkspacetomonitor, r
bind = $mainMod ALT, UP, movecurrentworkspacetomonitor, u
bind = $mainMod ALT, DOWN, movecurrentworkspacetomonitor, d

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, S
bind = $mainMod SHIFT, S, movetoworkspace, special:S
bind = $mainMod, D, togglespecialworkspace, D
bind = $mainMod SHIFT, D, movetoworkspace, special:D
bind = $mainMod, A, togglespecialworkspace, A
bind = $mainMod SHIFT, A, movetoworkspace, special:A


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, TAB,  workspace, e+1
bind = $mainMod, GRAVE, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
