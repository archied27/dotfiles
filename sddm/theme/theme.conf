[General]

# Path to the wallpaper. Matches the "background.path" used in the hyprlock config.
# NOTE: the sddm-greeter process runs as an unprivileged user (usually "sddm"), so
# make sure this file is world-readable (chmod o+r), or copy it into this theme's
# folder and point this at the local copy instead.
background=/home/archie/Pictures/wallpapers/mac/macos6.jpg

# Blur + dim, mirroring hyprlock's blur_passes/blur_size/brightness/contrast
blurMax=64
brightness=-0.25
contrast=-0.10

# Whether to show the logged-in username in small text above the password field.
# The hyprlock config has no username label at all (it's a single-user lock
# screen), so this defaults to false to match it as closely as possible.
showUsername=false

# Clock label — mirrors the hyprlock "label" block
clockFontFamily=Inter
clockFontWeight=DemiBold
clockFontSize=100
clockColor=#8CFFFFFF
clockOffsetY=-60

# Password pill — mirrors the hyprlock "input-field" block
fieldWidth=220
fieldHeight=50
fieldRounding=15
fieldColor=#2EFFFFFF
fieldFontColor=#E6FFFFFF
fieldOffsetY=100
dotSize=9
